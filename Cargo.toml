[package]
name = "apator_wmbus_mqtt"
version = "0.1.0"
edition = "2024"

[lints.rust]
unused_imports = "allow"
unused_variables = "allow"
non_snake_case = "allow"
dead_code = "allow"
unused = "allow"
non_upper_case_globals = "allow"

[dependencies]
gpio-cdev = { version = "0.6.0", features = ["async-tokio"] }
rumqttc = { version = "0.25.0", default-features = false, features = [] }
once_cell = "1.21.3"
spidev = "0.7.0"
libc = "1.0.0-alpha.1"
hex = "0.4.0"
binary-reader = "0.4.5"
crc = "3"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
anyhow = "1.0.100"
modular-bitfield = "0.13.0"
binrw = "0.15.0"
num-derive = "0.4.2"
num-traits = "0.2.19"
chrono = "0.4"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

